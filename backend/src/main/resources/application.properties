spring.application.name=red-flag-radar-api
server.port=${SERVER_PORT:8080}
spring.mvc.problemdetails.enabled=false
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Used by the Python-service client added in Stage 6.
detection.service.base-url=${DETECTION_SERVICE_URL:http://127.0.0.1:8000}
detection.service.connect-timeout=${DETECTION_SERVICE_CONNECT_TIMEOUT:2s}
detection.service.read-timeout=${DETECTION_SERVICE_READ_TIMEOUT:15s}
